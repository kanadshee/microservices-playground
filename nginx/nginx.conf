events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Detailed access log format tracking upstream timing and selected upstream instance
    log_format micro_telemetry '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time" '
                               'upstream="$upstream_addr" req_id="$http_x_request_id"';

    access_log /var/log/nginx/access.log micro_telemetry;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone (10 requests per second burstable)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstreams for microservices with round-robin load balancing
    upstream user_service {
        server user-service-1:4001 max_fails=3 fail_timeout=10s;
        server user-service-2:4002 max_fails=3 fail_timeout=10s;
    }

    upstream product_service {
        server product-service-1:4011 max_fails=3 fail_timeout=10s;
        server product-service-2:4012 max_fails=3 fail_timeout=10s;
        server product-service-3:4013 max_fails=3 fail_timeout=10s;
    }

    upstream order_service {
        server order-service-1:4021 max_fails=3 fail_timeout=10s;
        server order-service-2:4022 max_fails=3 fail_timeout=10s;
    }

    upstream notification_service {
        server notification-service-1:4031 max_fails=3 fail_timeout=10s;
        server notification-service-2:4032 max_fails=3 fail_timeout=10s;
    }

    upstream analytics_service {
        server analytics-service:4041 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID,X-Parent-Span-ID' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Generate request ID if not provided by client
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Forward response headers indicating selected instance
        add_header X-Request-ID $req_id always;
        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Upstream-Response-Time $upstream_response_time always;

        # User Service routing
        location /api/users/ {
            proxy_pass http://user_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location /api/users {
            proxy_pass http://user_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Product Service routing
        location /api/products/ {
            proxy_pass http://product_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location /api/products {
            proxy_pass http://product_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Order Service routing
        location /api/orders/ {
            proxy_pass http://order_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location /api/orders {
            proxy_pass http://order_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Notification Service routing
        location /api/notifications/ {
            proxy_pass http://notification_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location /api/notifications {
            proxy_pass http://notification_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Analytics Service & WebSocket routing
        location /api/analytics/ {
            proxy_pass http://analytics_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /api/analytics {
            proxy_pass http://analytics_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /events {
            proxy_pass http://analytics_service/events;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
        }
        location /ws {
            proxy_pass http://analytics_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health endpoint
        location /health {
            return 200 '{"status":"healthy","gateway":"NGINX Reverse Proxy"}';
            add_header Content-Type application/json;
        }
    }
}
